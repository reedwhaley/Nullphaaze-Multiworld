[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nullphaaze-network"
version = "0.1.0"
description = "NullPhaaze CP3W native runtime and host integration source"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
native = ["retro-data-structures==0.44.1", "open-prime-rando==0.15.1", "ppc-asm>=1.2.1"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nullphaaze_network*"]

[tool.setuptools.package-data]
nullphaaze_network = ["LICENSE", "**/*.c", "**/*.h", "**/*.S", "**/*.ld", "**/*.inc", "**/*.lua", "data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
